<header class="app-header">
  <a class="brand" routerLink="/home">MiniCommerce</a>

  <button
    type="button"
    class="account-button"
    [attr.aria-label]="signedIn() ? 'Sign out' : 'Sign in'"
    [title]="signedIn() ? 'Sign out' : 'Sign in'"
    (click)="onAccountClick()">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path fill="currentColor" d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" />
      <path fill="currentColor" d="M4 21v-1c0-3.3 4.7-5 8-5s8 1.7 8 5v1H4Z" />
    </svg>
  </button>
</header>
