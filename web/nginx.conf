# Serves the Angular app and routes /api calls to the services inside the Docker network.
# The browser only ever reaches this container. The services are not published to the host.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Reservations are called by Microservice.Orders during checkout, never by the browser.
    # ^~ makes this rule win over the /api/products rule below.
    location ^~ /api/products/reservations {
        return 404;
    }

    location /api/auth {
        proxy_pass http://identity:8080;
    }

    location /api/admin/users {
        proxy_pass http://identity:8080;
    }

    location /api/admin/products {
        proxy_pass http://products:8080;
    }

    location /api/products {
        proxy_pass http://products:8080;
    }

    location /api/cart {
        proxy_pass http://cart:8080;
    }

    location /api/orders {
        proxy_pass http://orders:8080;
    }

    # Angular routes (/home, /checkout, ...) are answered by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
